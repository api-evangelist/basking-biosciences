name: Basking Biosciences
description: 'Basking Biosciences is a clinical-stage biopharmaceutical company in
  Research Triangle, North Carolina (with operations in Mitchelton, Queensland, Australia)
  developing novel therapies for life-threatening blood clots. Its lead program BB-031
  is an investigational RNA aptamer that targets von Willebrand Factor (vWF) to deliver
  a rapid-onset, targeted, and reversible thrombolytic for acute ischemic stroke, paired
  with BB-025, a direct-acting reversal agent designed to rapidly neutralize BB-031.
  The company is running the RAISE Phase 2 clinical trial and is backed by Insight
  Partners. Surfaced as a VC portfolio company and added to the API Evangelist network;
  the company publishes no public developer API, SDK, or documentation surface, so
  this profile carries company identity only.'
